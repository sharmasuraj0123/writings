<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="Layered memory engine diagram">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <!-- memory graph: nodes and edges -->
  <g stroke="#b8b8b1" stroke-width="1">
    <line x1="60" y1="46" x2="118" y2="70"/>
    <line x1="118" y1="70" x2="92" y2="112"/>
    <line x1="118" y1="70" x2="176" y2="52"/>
    <line x1="176" y1="52" x2="232" y2="78"/>
    <line x1="232" y1="78" x2="262" y2="44"/>
    <line x1="232" y1="78" x2="204" y2="116"/>
    <line x1="92" y1="112" x2="152" y2="122"/>
    <line x1="152" y1="122" x2="204" y2="116"/>
  </g>
  <!-- contradiction edge -->
  <line x1="176" y1="52" x2="262" y2="44" stroke="#ad4b43" stroke-width="1.4" stroke-dasharray="4 3"/>
  <!-- nodes: episodic (blue), semantic (purple), procedural (green) -->
  <g>
    <circle cx="60" cy="46" r="8" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.6"/>
    <circle cx="118" cy="70" r="11" fill="#ece6f3" stroke="#765b98" stroke-width="1.6"/>
    <circle cx="92" cy="112" r="7" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.6"/>
    <circle cx="176" cy="52" r="8" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.6"/>
    <circle cx="232" cy="78" r="11" fill="#ece6f3" stroke="#765b98" stroke-width="1.6"/>
    <circle cx="262" cy="44" r="7" fill="#dfede5" stroke="#367f59" stroke-width="1.6"/>
    <circle cx="204" cy="116" r="7" fill="#dfede5" stroke="#367f59" stroke-width="1.6"/>
    <circle cx="152" cy="122" r="6" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.6"/>
  </g>
  <!-- pinned marker -->
  <circle cx="118" cy="70" r="15" fill="none" stroke="#d98226" stroke-width="1.4" stroke-dasharray="2.5 3"/>
  <!-- title strip -->
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">MEMORY ENGINE / TEARDOWN</text>
</svg>
