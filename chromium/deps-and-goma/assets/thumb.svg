<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="Silhouette of Figure 2: three columns — four boxes for the .gclient file you own, four for the project's DEPS, two for gclient's own entries cache — with the variable-precedence ladder as a strip below.">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">CHROMIUM / TEARDOWN</text>

  <!-- .gclient — yours: solutions, custom_vars, custom_deps, custom_hooks -->
  <rect x="18" y="38" width="76" height="16" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="18" y="60" width="76" height="16" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="18" y="82" width="76" height="16" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="18" y="104" width="76" height="16" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>

  <!-- src/DEPS — the project's: deps, vars, one entry URL, hooks -->
  <rect x="122" y="38" width="76" height="16" rx="3" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>
  <rect x="122" y="60" width="76" height="16" rx="3" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>
  <rect x="122" y="82" width="76" height="16" rx="3" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>
  <rect x="122" y="104" width="76" height="16" rx="3" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>

  <!-- .gclient_entries — gclient's own: written at the end, diffed on the next sync -->
  <rect x="226" y="42" width="76" height="30" rx="3" fill="#ece6f3" stroke="#765b98" stroke-width="1.2"/>
  <rect x="226" y="90" width="76" height="30" rx="3" fill="#ece6f3" stroke="#765b98" stroke-width="1.2"/>

  <!-- thick black = control (a Dependency per solution), thin blue = data (the three overrides) -->
  <line x1="94" y1="46" x2="122" y2="46" stroke="#252525" stroke-width="2"/>
  <line x1="94" y1="68" x2="122" y2="68" stroke="#3c6f97" stroke-width="1.2"/>
  <line x1="94" y1="90" x2="122" y2="90" stroke="#3c6f97" stroke-width="1.2"/>
  <line x1="94" y1="112" x2="122" y2="112" stroke="#3c6f97" stroke-width="1.2"/>

  <!-- dashed purple = effect: sync records what it checked out, the next sync reads it back -->
  <line x1="198" y1="57" x2="226" y2="57" stroke="#765b98" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="226" y1="105" x2="198" y2="105" stroke="#765b98" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- variable precedence ladder: DEPS vars < parent vars < built-ins < custom_vars -->
  <rect x="18" y="126" width="284" height="14" rx="3" fill="#f7f7f5" stroke="#deded9" stroke-width="1"/>
  <rect x="112" y="129" width="40" height="8" rx="2" fill="#dfede5" stroke="#367f59" stroke-width="1"/>
  <rect x="160" y="129" width="40" height="8" rx="2" fill="#dfede5" stroke="#367f59" stroke-width="1"/>
  <rect x="208" y="129" width="40" height="8" rx="2" fill="#ffffff" stroke="#b8b8b1" stroke-width="1"/>
  <rect x="256" y="129" width="40" height="8" rx="2" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1"/>

  <text x="18" y="153" font-family="SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1" fill="#777772">3 FILES · 451 DEPS · 3 TRANSPORTS</text>
</svg>
