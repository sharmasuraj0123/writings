<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="Silhouette of Figure 1: seven main-thread stage boxes ending at a heavy vertical rule, then three compositor-thread boxes and two Viz boxes beyond it">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">CHROMIUM / TEARDOWN</text>

  <!-- the boundary: compositor commit -->
  <line x1="186" y1="38" x2="186" y2="130" stroke="#252525" stroke-width="2.5"/>

  <!-- renderer main thread: animate, style, layout, pre-paint, scroll, paint, commit -->
  <rect x="18" y="42" width="20" height="18" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="42" y="42" width="20" height="18" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="66" y="42" width="20" height="18" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="90" y="42" width="20" height="18" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="114" y="42" width="20" height="18" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="138" y="42" width="20" height="18" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="162" y="42" width="20" height="18" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="2"/>

  <!-- the DocumentLifecycle strip under the Blink half -->
  <rect x="18" y="64" width="164" height="6" rx="2" fill="#f7f7f5" stroke="#deded9" stroke-width="1"/>

  <!-- renderer compositor thread: ghosts for animate and scroll, then layerize, raster, activate -->
  <rect x="18" y="78" width="20" height="18" rx="3" fill="none" stroke="#b8b8b1" stroke-width="1" stroke-dasharray="3 2.5"/>
  <rect x="114" y="78" width="20" height="18" rx="3" fill="none" stroke="#b8b8b1" stroke-width="1" stroke-dasharray="3 2.5"/>
  <rect x="192" y="78" width="20" height="18" rx="3" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>
  <rect x="216" y="78" width="20" height="18" rx="3" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>
  <rect x="240" y="78" width="20" height="18" rx="3" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>

  <!-- viz process: aggregate, draw -->
  <rect x="258" y="108" width="20" height="18" rx="3" fill="#ece6f3" stroke="#765b98" stroke-width="1.2"/>
  <rect x="282" y="108" width="20" height="18" rx="3" fill="#ece6f3" stroke="#765b98" stroke-width="1.2"/>

  <!-- commit hands the frame across: thick black = control -->
  <line x1="182" y1="51" x2="192" y2="78" stroke="#252525" stroke-width="2"/>
  <line x1="260" y1="96" x2="268" y2="108" stroke="#252525" stroke-width="2"/>

  <text x="18" y="148" font-family="SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1" fill="#777772">12 STAGES · BLINK ENDS AT COMMIT</text>
</svg>
