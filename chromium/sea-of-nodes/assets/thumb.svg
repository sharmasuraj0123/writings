<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="A small sea-of-nodes graph with value, control and effect edges">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">SEA OF NODES / EXPLAINER</text>

  <!-- control spine: thick, dark, top to bottom -->
  <g stroke="#252525" stroke-width="2.2" fill="none">
    <line x1="160" y1="60" x2="160" y2="82"/>
    <line x1="150" y1="94" x2="112" y2="112"/>
    <line x1="170" y1="94" x2="208" y2="112"/>
    <line x1="112" y1="124" x2="150" y2="140"/>
    <line x1="208" y1="124" x2="170" y2="140"/>
  </g>

  <!-- value edges: thin, blue, converging from floating pure nodes -->
  <g stroke="#3c6f97" stroke-width="1.1" fill="none">
    <line x1="52" y1="56" x2="86" y2="76"/>
    <line x1="112" y1="56" x2="90" y2="76"/>
    <line x1="90" y1="88" x2="106" y2="110"/>
    <line x1="262" y1="56" x2="212" y2="66"/>
    <line x1="212" y1="66" x2="164" y2="58"/>
  </g>

  <!-- effect chain: dashed, purple, off to one side -->
  <g stroke="#765b98" stroke-width="1.5" fill="none" stroke-dasharray="4 3.5">
    <line x1="238" y1="94" x2="272" y2="94"/>
    <line x1="284" y1="94" x2="300" y2="94"/>
  </g>

  <!-- floating pure nodes (blue, no control) -->
  <rect x="30" y="46" width="44" height="12" rx="4" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="94" y="46" width="40" height="12" rx="4" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="240" y="46" width="44" height="12" rx="4" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="72" y="76" width="36" height="12" rx="4" fill="#f7e3c8" stroke="#d98226" stroke-width="1.4"/>

  <!-- control nodes (dark outline) -->
  <rect x="138" y="48" width="44" height="12" rx="4" fill="#ffffff" stroke="#252525" stroke-width="1.4"/>
  <rect x="138" y="82" width="44" height="12" rx="4" fill="#ffffff" stroke="#252525" stroke-width="1.4"/>
  <rect x="90" y="112" width="44" height="12" rx="4" fill="#dfede5" stroke="#367f59" stroke-width="1.4"/>
  <rect x="186" y="112" width="44" height="12" rx="4" fill="#f3dfdc" stroke="#ad4b43" stroke-width="1.4"/>
  <rect x="138" y="140" width="44" height="12" rx="4" fill="#ffffff" stroke="#252525" stroke-width="1.4"/>

  <!-- effect nodes -->
  <rect x="214" y="88" width="24" height="12" rx="4" fill="#ece6f3" stroke="#765b98" stroke-width="1.2"/>
  <rect x="272" y="88" width="12" height="12" rx="4" fill="#ece6f3" stroke="#765b98" stroke-width="1.2"/>

  <!-- the floating marker: pure node with nothing holding it down -->
  <circle cx="90" cy="82" r="17" fill="none" stroke="#d98226" stroke-width="1.2" stroke-dasharray="2.5 3"/>
</svg>
