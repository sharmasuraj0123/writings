<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="Silhouette of Figure 2: four blue input boxes on the left, a grey lucicfg box holding three stages in the middle, three green generated-output boxes on the right, and a dashed purple row underneath for the import cron and the service poll">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">CHROMIUM / TEARDOWN</text>

  <!-- inputs in the tree: PACKAGE.star, 125 .star files, settings/milestones, lib constants -->
  <rect x="18" y="42" width="64" height="17" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="18" y="62" width="64" height="17" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="18" y="82" width="64" height="13" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="18" y="98" width="64" height="13" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>

  <!-- lucicfg: one container, three stages -->
  <rect x="92" y="42" width="58" height="69" rx="5" fill="#f7f7f5" stroke="#b8b8b1" stroke-width="1.2"/>
  <rect x="97" y="48" width="48" height="13" rx="3" fill="#ffffff" stroke="#deded9" stroke-width="1"/>
  <rect x="97" y="67" width="48" height="13" rx="3" fill="#ffffff" stroke="#deded9" stroke-width="1"/>
  <rect x="97" y="86" width="48" height="13" rx="3" fill="#ffffff" stroke="#deded9" stroke-width="1"/>

  <!-- generated/ in the tree: luci/, builders/, the rest -->
  <rect x="172" y="42" width="130" height="31" rx="3" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>
  <rect x="172" y="77" width="130" height="17" rx="3" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>
  <rect x="172" y="98" width="130" height="13" rx="3" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>

  <!-- thin blue = data in, thick black = control out -->
  <line x1="82" y1="76" x2="92" y2="76" stroke="#3c6f97" stroke-width="1.2"/>
  <line x1="150" y1="76" x2="172" y2="76" stroke="#252525" stroke-width="2"/>

  <!-- after the CL lands, outside the tree: dashed purple = effect -->
  <rect x="18" y="120" width="76" height="12" rx="3" fill="#ece6f3" stroke="#765b98" stroke-width="1.2"/>
  <rect x="110" y="120" width="88" height="12" rx="3" fill="#ece6f3" stroke="#765b98" stroke-width="1.2"/>
  <rect x="214" y="120" width="88" height="12" rx="3" fill="#ece6f3" stroke="#765b98" stroke-width="1.2"/>
  <path d="M237 111 C237 120 120 110 56 120" fill="none" stroke="#765b98" stroke-width="1.2" stroke-dasharray="3 2.5"/>
  <line x1="94" y1="126" x2="110" y2="126" stroke="#765b98" stroke-width="1.2" stroke-dasharray="3 2.5"/>
  <line x1="198" y1="126" x2="214" y2="126" stroke="#765b98" stroke-width="1.2" stroke-dasharray="3 2.5"/>

  <text x="18" y="148" font-family="SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1" fill="#777772">125 .STAR IN · 3,555 FILES OUT · A POLL</text>
</svg>
