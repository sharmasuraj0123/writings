<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="Silhouette of Figure 1: one route from file to click as fifteen boxes in three lanes, seven build artifacts above three server steps and five browser steps, joined by blue data drops and a black control path">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">NEXT.JS / TEARDOWN</text>

  <!-- browser-lane divider: prefetch | navigation -->
  <line x1="188.7" y1="102" x2="188.7" y2="130" stroke="#deded9" stroke-width="1"/>

  <!-- build lane -->
  <rect x="19.5" y="38" width="35.5" height="24" rx="2" fill="#f7f7f5" stroke="#b8b8b1" stroke-width="1.2"/>
  <rect x="59.1" y="38" width="35.5" height="24" rx="2" fill="#ece6f3" stroke="#765b98" stroke-width="1.2"/>
  <rect x="98.6" y="38" width="38.0" height="24" rx="2" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>
  <rect x="140.7" y="38" width="40.1" height="24" rx="2" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>
  <rect x="184.8" y="38" width="34.5" height="24" rx="2" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>
  <rect x="223.4" y="38" width="38.5" height="24" rx="2" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>
  <rect x="266.0" y="38" width="34.5" height="24" rx="2" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>
  <line x1="55.0" y1="44" x2="59.1" y2="44" stroke="#252525" stroke-width="1.6"/>
  <line x1="94.6" y1="44" x2="98.6" y2="44" stroke="#252525" stroke-width="1.6"/>
  <line x1="136.7" y1="44" x2="140.7" y2="44" stroke="#252525" stroke-width="1.6"/>
  <line x1="180.8" y1="44" x2="184.8" y2="44" stroke="#252525" stroke-width="1.6"/>
  <line x1="219.3" y1="44" x2="223.4" y2="44" stroke="#252525" stroke-width="1.6"/>
  <line x1="261.9" y1="44" x2="266.0" y2="44" stroke="#252525" stroke-width="1.6"/>

  <!-- server lane -->
  <rect x="86.5" y="71" width="50.7" height="24" rx="2" fill="#ece6f3" stroke="#765b98" stroke-width="1.2"/>
  <rect x="167.6" y="71" width="65.9" height="24" rx="2" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="248.8" y="71" width="51.7" height="24" rx="2" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <line x1="137.2" y1="77" x2="167.6" y2="77" stroke="#252525" stroke-width="1.6"/>
  <line x1="233.5" y1="77" x2="248.8" y2="77" stroke="#252525" stroke-width="1.6"/>

  <!-- browser lane -->
  <rect x="19.5" y="106" width="51.7" height="24" rx="2" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="76.8" y="106" width="51.7" height="24" rx="2" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="134.1" y="106" width="51.7" height="24" rx="2" fill="#ece6f3" stroke="#765b98" stroke-width="1.2"/>
  <rect x="191.4" y="106" width="51.7" height="24" rx="2" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="248.8" y="106" width="51.7" height="24" rx="2" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <line x1="71.2" y1="112" x2="76.8" y2="112" stroke="#252525" stroke-width="1.6"/>
  <line x1="128.6" y1="112" x2="134.1" y2="112" stroke="#252525" stroke-width="1.6"/>
  <line x1="243.2" y1="112" x2="248.8" y2="112" stroke="#252525" stroke-width="1.6"/>

  <!-- build files read at runtime: thin blue = data -->
  <line x1="117.7" y1="62" x2="117.7" y2="71" stroke="#3c6f97" stroke-width="1.2"/>
  <line x1="226.4" y1="62" x2="226.4" y2="71" stroke="#3c6f97" stroke-width="1.2"/>

  <!-- the document hands off to the browser: thick black = control -->
  <path d="M274.6 95 L274.6 100 L44.4 100 L44.4 106" fill="none" stroke="#252525" stroke-width="1.6"/>

  <text x="18" y="150" font-family="SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1" fill="#777772">15 ARTIFACTS · ONE ROUTE, FILE TO CLICK</text>
</svg>
