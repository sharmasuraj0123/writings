<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="Silhouette of Figure 1: a row of six state circles joined by arrows, the fourth ringed in orange as the present, with two dashed red arcs from the past struck through above">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">FOUNDATIONS / EXPLAINER</text>

  <!-- the present, screened -->
  <rect x="164" y="56" width="36" height="46" rx="4" fill="#f7e3c8" stroke="#d98226" stroke-width="1" stroke-dasharray="3 2.5"/>

  <!-- the forbidden edges: past jumping the screen -->
  <path d="M30 70 C 90 40 180 40 232 68" fill="none" stroke="#ad4b43" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M74 70 C 120 48 190 48 230 70" fill="none" stroke="#ad4b43" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="124" y1="42" x2="136" y2="54" stroke="#ad4b43" stroke-width="2"/>
  <line x1="136" y1="42" x2="124" y2="54" stroke="#ad4b43" stroke-width="2"/>

  <!-- the trajectory: past (grey), present (orange), future (blue) -->
  <line x1="42" y1="79" x2="62" y2="79" stroke="#252525" stroke-width="1.4"/>
  <line x1="86" y1="79" x2="106" y2="79" stroke="#252525" stroke-width="1.4"/>
  <line x1="130" y1="79" x2="150" y2="79" stroke="#252525" stroke-width="1.4"/>
  <line x1="214" y1="79" x2="234" y2="79" stroke="#252525" stroke-width="2"/>
  <line x1="258" y1="79" x2="278" y2="79" stroke="#252525" stroke-width="2"/>

  <circle cx="30" cy="79" r="12" fill="#f7f7f5" stroke="#b8b8b1" stroke-width="1.2"/>
  <circle cx="74" cy="79" r="12" fill="#f7f7f5" stroke="#b8b8b1" stroke-width="1.2"/>
  <circle cx="118" cy="79" r="12" fill="#f7f7f5" stroke="#b8b8b1" stroke-width="1.2"/>
  <circle cx="182" cy="79" r="14" fill="#ffffff" stroke="#d98226" stroke-width="2.5"/>
  <circle cx="246" cy="79" r="12" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <circle cx="290" cy="79" r="12" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>

  <rect x="18" y="116" width="284" height="1" fill="#deded9"/>
  <text x="18" y="140" font-family="SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1" fill="#777772">NO EDGE MAY SKIP THE PRESENT</text>
</svg>
