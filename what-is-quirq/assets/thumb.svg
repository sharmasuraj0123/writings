<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-labelledby="thumb-lifecycle-title">
  <title id="thumb-lifecycle-title">Unit lifecycle: defined, executed, captured, scored, minted</title>
  <rect width="320" height="160" fill="#f7f7f5"/>

  <!-- pipeline baseline -->
  <line x1="40" y1="74" x2="220" y2="74" stroke="#deded9" stroke-width="2"/>
  <line x1="220" y1="74" x2="280" y2="74" stroke="#d98226" stroke-width="2"/>

  <!-- direction chevrons -->
  <g fill="none" stroke="#777772" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="67,70 72,74 67,78"/>
    <polyline points="127,70 132,74 127,78"/>
    <polyline points="187,70 192,74 187,78"/>
    <polyline points="247,70 252,74 247,78" stroke="#d98226"/>
  </g>

  <!-- defined: an empty contract -->
  <circle cx="40" cy="74" r="9" fill="#f7f7f5" stroke="#252525" stroke-width="2"/>

  <!-- executed: work under way -->
  <circle cx="100" cy="74" r="9" fill="#f7f7f5" stroke="#252525" stroke-width="2"/>
  <circle cx="100" cy="74" r="3" fill="#252525"/>

  <!-- captured: world state snapshotted -->
  <circle cx="160" cy="74" r="9" fill="#f7f7f5" stroke="#252525" stroke-width="2"/>
  <rect x="156.5" y="70.5" width="7" height="7" fill="none" stroke="#252525" stroke-width="1.6"/>

  <!-- scored: verified against the definition of done -->
  <circle cx="220" cy="74" r="9" fill="#f7f7f5" stroke="#252525" stroke-width="2"/>
  <path d="M 216 74 L 219 77.5 L 224.5 70.5" fill="none" stroke="#252525" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- minted: the quirq -->
  <circle cx="280" cy="74" r="13.5" fill="none" stroke="#d98226" stroke-width="1.6"/>
  <circle cx="280" cy="74" r="9" fill="#d98226"/>

  <!-- stage labels -->
  <g font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace' font-size="9.5" letter-spacing="0.08" text-anchor="middle" fill="#777772">
    <text x="40" y="106">DEFINED</text>
    <text x="100" y="106">EXECUTED</text>
    <text x="160" y="106">CAPTURED</text>
    <text x="220" y="106">SCORED</text>
    <text x="280" y="106" fill="#d98226">MINTED</text>
  </g>
</svg>
