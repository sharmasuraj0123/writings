<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="A narrow workspace band inside a wide activation vector">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">J-SPACE / CONSTRUCTION</text>

  <!-- depth bar: sensory / workspace / motor -->
  <rect x="18" y="44" width="106" height="14" rx="4" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.1"/>
  <rect x="126" y="44" width="150" height="14" rx="4" fill="#f7e3c8" stroke="#d98226" stroke-width="1.5"/>
  <rect x="278" y="44" width="24" height="14" rx="4" fill="#f3dfdc" stroke="#ad4b43" stroke-width="1.1"/>
  <text x="18" y="72" font-family="SFMono-Regular, Consolas, monospace" font-size="7" letter-spacing="0.8" fill="#b8b8b1">L0</text>
  <text x="126" y="72" font-family="SFMono-Regular, Consolas, monospace" font-size="7" letter-spacing="0.8" fill="#d98226">~L38</text>
  <text x="266" y="72" font-family="SFMono-Regular, Consolas, monospace" font-size="7" letter-spacing="0.8" fill="#b8b8b1">~L92</text>

  <!-- the activation vector: a small J-space component, a large remainder -->
  <rect x="18" y="88" width="284" height="20" rx="5" fill="#ffffff" stroke="#deded9"/>
  <rect x="18" y="88" width="20" height="20" rx="5" fill="#f7e3c8" stroke="#d98226" stroke-width="1.5"/>
  <text x="202" y="102" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" letter-spacing="0.8" fill="#b8b8b1" text-anchor="middle">~93% OUTSIDE THE J-SPACE</text>

  <!-- sparse active atoms fanning out of the small component -->
  <g stroke="#b8b8b1" stroke-width="0.9">
    <line x1="28" y1="108" x2="40" y2="128"/>
    <line x1="28" y1="108" x2="66" y2="128"/>
    <line x1="28" y1="108" x2="92" y2="128"/>
    <line x1="28" y1="108" x2="118" y2="128"/>
  </g>
  <g>
    <circle cx="40" cy="132" r="4.5" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
    <circle cx="66" cy="132" r="3.4" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
    <circle cx="92" cy="132" r="5.2" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
    <circle cx="118" cy="132" r="2.8" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  </g>
  <text x="132" y="136" font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" letter-spacing="0.8" fill="#777772">≤ 25 ACTIVE J-LENS VECTORS</text>

  <!-- the cone: nonnegative sparse combination -->
  <path d="M262 152 L286 116 L306 152 Z" fill="none" stroke="#d98226" stroke-width="1.1" stroke-dasharray="2.5 2.5"/>

  <!-- ring marking the tiny component that carries the leverage -->
  <circle cx="28" cy="98" r="15" fill="none" stroke="#d98226" stroke-width="1.1" stroke-dasharray="2.5 3"/>
</svg>
