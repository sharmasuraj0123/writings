<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="Silhouette of Figure 1: browser clients on the left, a hosted room in the middle, your server on the right">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">READING NOTE / PROPOSAL</text>

  <!-- clients -->
  <rect x="18" y="46" width="72" height="22" rx="4" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="18" y="76" width="72" height="22" rx="4" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>
  <rect x="18" y="106" width="72" height="22" rx="4" fill="#ece6f3" stroke="#765b98" stroke-width="1.2"/>

  <!-- room -->
  <rect x="122" y="42" width="84" height="90" rx="6" fill="#ffffff" stroke="#b8b8b1" stroke-width="1.2"/>
  <rect x="130" y="52" width="68" height="8" rx="2" fill="#f7f7f5" stroke="#deded9" stroke-width="1"/>
  <rect x="130" y="66" width="68" height="8" rx="2" fill="#f7f7f5" stroke="#deded9" stroke-width="1"/>
  <rect x="130" y="80" width="68" height="8" rx="2" fill="#f7f7f5" stroke="#deded9" stroke-width="1"/>
  <rect x="130" y="94" width="68" height="8" rx="2" fill="#f7f7f5" stroke="#deded9" stroke-width="1"/>
  <rect x="130" y="108" width="68" height="8" rx="2" fill="#f7f7f5" stroke="#deded9" stroke-width="1"/>

  <!-- server -->
  <rect x="238" y="46" width="64" height="22" rx="4" fill="#ffffff" stroke="#252525" stroke-width="1.2"/>
  <rect x="238" y="76" width="64" height="22" rx="4" fill="#ffffff" stroke="#252525" stroke-width="1.2"/>
  <rect x="238" y="106" width="64" height="22" rx="4" fill="#ffffff" stroke="#252525" stroke-width="1.2"/>

  <!-- edges: thin blue data, thick black control, dashed purple effect -->
  <line x1="90" y1="57" x2="122" y2="70" stroke="#3c6f97" stroke-width="1.2"/>
  <line x1="90" y1="87" x2="122" y2="87" stroke="#3c6f97" stroke-width="1.2"/>
  <line x1="90" y1="117" x2="122" y2="104" stroke="#765b98" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="238" y1="87" x2="206" y2="87" stroke="#252525" stroke-width="2"/>
  <line x1="206" y1="117" x2="238" y2="117" stroke="#765b98" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M54 46 C54 34 270 34 270 46" fill="none" stroke="#252525" stroke-width="2"/>

  <text x="18" y="148" font-family="SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1" fill="#777772">CLIENTS · ROOM (HOSTED) · YOUR SERVER</text>
</svg>
