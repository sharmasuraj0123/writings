<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="One router, one seam, four divergent runtimes">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <!-- title strip -->
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">CONTROL PLANE / TEARDOWN</text>

  <!-- router band: one uniform surface -->
  <rect x="18" y="42" width="284" height="18" rx="4" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>

  <!-- the seam -->
  <line x1="18" y1="74" x2="302" y2="74" stroke="#d98226" stroke-width="2"/>
  <circle cx="160" cy="74" r="5.5" fill="#f7e3c8" stroke="#d98226" stroke-width="1.6"/>

  <!-- fan-out from the seam to four adapters -->
  <g stroke="#b8b8b1" stroke-width="1">
    <line x1="160" y1="80" x2="52" y2="98"/>
    <line x1="160" y1="80" x2="124" y2="98"/>
    <line x1="160" y1="80" x2="196" y2="98"/>
    <line x1="160" y1="80" x2="268" y2="98"/>
  </g>
  <g stroke="#deded9" stroke-width="1">
    <line x1="18" y1="60" x2="52" y2="42"/>
  </g>

  <!-- four adapters, four different transports: subprocess, http, sqlite, transcript -->
  <rect x="26" y="98" width="52" height="40" rx="6" fill="#ece6f3" stroke="#765b98" stroke-width="1.4"/>
  <rect x="98" y="98" width="52" height="40" rx="6" fill="#dfede5" stroke="#367f59" stroke-width="1.4"/>
  <rect x="170" y="98" width="52" height="40" rx="6" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.4"/>
  <rect x="242" y="98" width="52" height="40" rx="6" fill="#f7e3c8" stroke="#d98226" stroke-width="1.4"/>

  <!-- transport glyphs -->
  <g stroke="#765b98" stroke-width="1.3" fill="none">
    <path d="M38 118 h12 M50 118 l-4 -4 M50 118 l-4 4"/>
  </g>
  <g stroke="#367f59" stroke-width="1.3" fill="none">
    <path d="M110 122 q7 -12 14 0 t14 0"/>
  </g>
  <g stroke="#3c6f97" stroke-width="1.3" fill="none">
    <ellipse cx="196" cy="112" rx="12" ry="4.5"/>
    <path d="M184 112 v10 q12 6 24 0 v-10"/>
  </g>
  <g stroke="#d98226" stroke-width="1.3" fill="none">
    <path d="M256 110 h20 M256 116 h20 M256 122 h13"/>
  </g>

  <!-- absent capability: the dashed slot -->
  <rect x="98" y="98" width="52" height="40" rx="6" fill="none" stroke="#b8b8b1" stroke-width="1.2" stroke-dasharray="3 3"/>
</svg>
