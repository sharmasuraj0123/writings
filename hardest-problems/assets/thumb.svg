<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="Descending bars, the bound on prime gaps falling from 70 million to 2">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">OPEN PROBLEMS / SURVEY</text>

  <!-- baseline the bars grow from -->
  <line x1="36" y1="40" x2="36" y2="148" stroke="#b8b8b1" stroke-width="1"/>

  <!-- unconditional records: 70,000,000 → 4,680 → 600 → 246 (bar length ∝ log) -->
  <rect x="36" y="44" width="260" height="12" rx="3" fill="#f7e3c8" stroke="#d98226" stroke-width="1.2"/>
  <rect x="36" y="62" width="121" height="12" rx="3" fill="#f7e3c8" stroke="#d98226" stroke-width="1.2"/>
  <rect x="36" y="80" width="92" height="12" rx="3" fill="#f7e3c8" stroke="#d98226" stroke-width="1.2"/>
  <rect x="36" y="98" width="79" height="12" rx="3" fill="#f7e3c8" stroke="#d98226" stroke-width="1.2"/>

  <!-- conditional bound -->
  <rect x="36" y="116" width="26" height="12" rx="3" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.2"/>

  <!-- the conjecture itself -->
  <rect x="36" y="134" width="10" height="12" rx="3" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>

  <!-- the floor the method cannot cross -->
  <line x1="70" y1="112" x2="70" y2="152" stroke="#d98226" stroke-width="1" stroke-dasharray="2.5 3"/>
</svg>
