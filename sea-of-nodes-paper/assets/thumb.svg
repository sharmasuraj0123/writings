<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="A loop as a graph: REGION, PHI, ADD and a back edge">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">IR'95 / CLOSE READING</text>

  <!-- loop-back control edge, behind everything -->
  <g stroke="#252525" stroke-width="1.8" fill="none">
    <polyline points="196,128 22,128 22,68 46,68"/>
  </g>

  <!-- control spine -->
  <g stroke="#252525" stroke-width="1.8" fill="none">
    <line x1="70" y1="52" x2="70" y2="60"/>
    <polyline points="70,76 70,104 226,104 226,112"/>
    <line x1="216" y1="128" x2="204" y2="128"/>
  </g>

  <!-- data edges -->
  <g stroke="#3c6f97" stroke-width="1.1" fill="none">
    <line x1="94" y1="68" x2="118" y2="68"/>
    <line x1="166" y1="68" x2="190" y2="68"/>
    <line x1="150" y1="52" x2="150" y2="60"/>
    <line x1="226" y1="52" x2="226" y2="60"/>
    <polyline points="212,76 212,88 134,88 134,76"/>
  </g>

  <!-- inputs -->
  <rect x="52" y="40" width="36" height="12" rx="4" fill="#ffffff" stroke="#252525" stroke-width="1.2"/>
  <rect x="130" y="40" width="40" height="12" rx="4" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.1"/>
  <rect x="208" y="40" width="36" height="12" rx="4" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.1"/>

  <!-- the ring: REGION, PHI, ADD -->
  <rect x="46" y="60" width="48" height="16" rx="5" fill="#ffffff" stroke="#252525" stroke-width="1.6"/>
  <rect x="118" y="60" width="48" height="16" rx="5" fill="#e0ebf2" stroke="#3c6f97" stroke-width="1.6"/>
  <rect x="190" y="60" width="48" height="16" rx="5" fill="#f7e3c8" stroke="#d98226" stroke-width="1.6"/>

  <!-- the branch -->
  <rect x="204" y="112" width="48" height="16" rx="5" fill="#ffffff" stroke="#252525" stroke-width="1.6"/>
  <rect x="268" y="112" width="34" height="16" rx="5" fill="#f3dfdc" stroke="#ad4b43" stroke-width="1.3"/>
  <g stroke="#252525" stroke-width="1.8" fill="none">
    <line x1="252" y1="120" x2="268" y2="120"/>
  </g>

  <!-- store chain, off to the side -->
  <g stroke="#765b98" stroke-width="1.4" fill="none" stroke-dasharray="4 3.5">
    <line x1="266" y1="68" x2="292" y2="68"/>
  </g>
  <rect x="292" y="62" width="14" height="12" rx="4" fill="#ece6f3" stroke="#765b98" stroke-width="1.2"/>

  <!-- no-box marker: the loop head has no basic block around it -->
  <rect x="38" y="52" width="208" height="32" rx="8" fill="none" stroke="#b8b8b1" stroke-width="1" stroke-dasharray="2.5 3.5"/>
  <text x="18" y="150" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5" letter-spacing="1.2" fill="#b8b8b1">NO BASIC BLOCKS · CLICK &amp; PALECZNY 1995</text>
</svg>
