<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="Silhouette of the measured write-cost figure: five horizontal bars on a log scale, from a JSON file rewritten with fsync at about 1,465 microseconds per update down to batched SQLite inserts at about 4 microseconds">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">DATA SYSTEMS / FIELD GUIDE</text>
  <rect x="18" y="42" width="192" height="12" rx="2" fill="#ad4b43" opacity="0.85"/>
  <text x="216" y="52" font-family="SFMono-Regular, Consolas, monospace" font-size="9" fill="#252525">1464.5 µs</text>
  <rect x="18" y="61" width="182" height="12" rx="2" fill="#d98226" opacity="0.85"/>
  <text x="206" y="71" font-family="SFMono-Regular, Consolas, monospace" font-size="9" fill="#252525">991 µs</text>
  <rect x="18" y="80" width="159" height="12" rx="2" fill="#d98226" opacity="0.85"/>
  <text x="183" y="90" font-family="SFMono-Regular, Consolas, monospace" font-size="9" fill="#252525">417.6 µs</text>
  <rect x="18" y="99" width="63" height="12" rx="2" fill="#367f59" opacity="0.85"/>
  <text x="87" y="109" font-family="SFMono-Regular, Consolas, monospace" font-size="9" fill="#252525">10.8 µs</text>
  <rect x="18" y="118" width="34" height="12" rx="2" fill="#3c6f97" opacity="0.85"/>
  <text x="58" y="128" font-family="SFMono-Regular, Consolas, monospace" font-size="9" fill="#252525">3.6 µs</text>
  <rect x="18" y="138" width="284" height="1" fill="#deded9"/>
  <text x="18" y="153" font-family="SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1" fill="#777772">WHERE THE JSON LIVES</text>
</svg>
