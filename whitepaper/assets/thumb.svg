<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-labelledby="thumb-meters-title">
  <title id="thumb-meters-title">Two meters: the token meters input, the quirq meters output</title>
  <rect width="320" height="160" fill="#f7f7f5"/>

  <!-- left dial: the token, input meter -->
  <line x1="42" y1="102" x2="134" y2="102" stroke="#deded9" stroke-width="2"/>
  <path d="M 42 102 A 46 46 0 0 1 134 102" fill="none" stroke="#252525" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#777772" stroke-width="1.4">
    <line x1="52" y1="102" x2="46" y2="102"/>
    <line x1="62.5" y1="76.5" x2="58.3" y2="72.3"/>
    <line x1="88" y1="66" x2="88" y2="60"/>
    <line x1="113.5" y1="76.5" x2="117.7" y2="72.3"/>
    <line x1="124" y1="102" x2="130" y2="102"/>
  </g>
  <line x1="88" y1="102" x2="66.8" y2="80.8" stroke="#252525" stroke-width="3" stroke-linecap="round"/>
  <circle cx="88" cy="102" r="4" fill="#252525"/>

  <!-- arrow: input becomes output -->
  <line x1="142" y1="88" x2="172" y2="88" stroke="#777772" stroke-width="2" stroke-linecap="round"/>
  <polyline points="167,82.5 173,88 167,93.5" fill="none" stroke="#777772" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right dial: the quirq, output meter -->
  <line x1="186" y1="102" x2="278" y2="102" stroke="#deded9" stroke-width="2"/>
  <path d="M 186 102 A 46 46 0 0 1 278 102" fill="none" stroke="#d98226" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#777772" stroke-width="1.4">
    <line x1="196" y1="102" x2="190" y2="102"/>
    <line x1="206.5" y1="76.5" x2="202.3" y2="72.3"/>
    <line x1="232" y1="66" x2="232" y2="60"/>
    <line x1="257.5" y1="76.5" x2="261.7" y2="72.3"/>
    <line x1="268" y1="102" x2="274" y2="102"/>
  </g>
  <line x1="232" y1="102" x2="253.2" y2="80.8" stroke="#d98226" stroke-width="3" stroke-linecap="round"/>
  <circle cx="232" cy="102" r="4" fill="#d98226"/>

  <!-- meter labels -->
  <g font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace' font-size="10" letter-spacing="0.12" text-anchor="middle">
    <text x="88" y="130" fill="#777772">TOKEN</text>
    <text x="232" y="130" fill="#d98226">QUIRQ</text>
  </g>
</svg>
