<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="Silhouette of Figure 1: four stacked bands for the host, the process, the conversation and the workspace, with the conversation band in orange as the only durable layer, and arrows between the bands">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">CLAUDE CODE / TEARDOWN</text>

  <!-- host -->
  <rect x="18" y="38" width="284" height="20" rx="4" fill="#f7f7f5" stroke="#b8b8b1" stroke-width="1.2"/>
  <rect x="26" y="45" width="70" height="6" rx="2" fill="#b8b8b1"/>
  <rect x="170" y="45" width="110" height="6" rx="2" fill="#deded9"/>

  <!-- process -->
  <rect x="18" y="64" width="284" height="20" rx="4" fill="#ffffff" stroke="#252525" stroke-width="1.2"/>
  <rect x="26" y="71" width="84" height="6" rx="2" fill="#777772"/>
  <rect x="170" y="71" width="96" height="6" rx="2" fill="#deded9"/>

  <!-- conversation: the durable layer -->
  <rect x="18" y="90" width="284" height="20" rx="4" fill="#f7e3c8" stroke="#d98226" stroke-width="1.6"/>
  <rect x="26" y="97" width="104" height="6" rx="2" fill="#d98226"/>
  <rect x="170" y="97" width="118" height="6" rx="2" fill="#e9c393"/>

  <!-- workspace -->
  <rect x="18" y="116" width="284" height="20" rx="4" fill="#ffffff" stroke="#367f59" stroke-width="1.2"/>
  <rect x="26" y="123" width="90" height="6" rx="2" fill="#367f59"/>
  <rect x="170" y="123" width="88" height="6" rx="2" fill="#dfede5"/>

  <!-- thick black = control: spawns, writes, runs in -->
  <line x1="150" y1="58" x2="150" y2="64" stroke="#252525" stroke-width="2"/>
  <line x1="150" y1="84" x2="150" y2="90" stroke="#252525" stroke-width="2"/>
  <line x1="150" y1="110" x2="150" y2="116" stroke="#252525" stroke-width="2"/>

  <text x="18" y="152" font-family="SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1" fill="#777772">4 IDENTITIES · 120 FLAGS · 7 DOORS</text>
</svg>
