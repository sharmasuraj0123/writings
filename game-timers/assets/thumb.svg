<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="Silhouette of Figure 3: an upper band densely filled with tick marks representing a tick loop, and a lower empty band with a single mark at its right edge representing lazy resolution on login">
  <rect width="320" height="160" fill="#f7f7f5"/>
  <rect x="0" y="0" width="320" height="4" fill="#d98226"/>
  <text x="18" y="28" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#777772">PRODUCT ENGINEERING / NOTE</text>

  <!-- design A: a tick loop, ticking the whole time -->
  <rect x="18" y="44" width="248" height="28" rx="4" fill="#f3dfdc" stroke="#ad4b43" stroke-width="1.2"/>
  <g stroke="#ad4b43" stroke-width="1">
    <line x1="28" y1="44" x2="28" y2="72"/><line x1="40" y1="44" x2="40" y2="72"/><line x1="52" y1="44" x2="52" y2="72"/>
    <line x1="64" y1="44" x2="64" y2="72"/><line x1="76" y1="44" x2="76" y2="72"/><line x1="88" y1="44" x2="88" y2="72"/>
    <line x1="100" y1="44" x2="100" y2="72"/><line x1="112" y1="44" x2="112" y2="72"/><line x1="124" y1="44" x2="124" y2="72"/>
    <line x1="136" y1="44" x2="136" y2="72"/><line x1="148" y1="44" x2="148" y2="72"/><line x1="160" y1="44" x2="160" y2="72"/>
    <line x1="172" y1="44" x2="172" y2="72"/><line x1="184" y1="44" x2="184" y2="72"/><line x1="196" y1="44" x2="196" y2="72"/>
    <line x1="208" y1="44" x2="208" y2="72"/><line x1="220" y1="44" x2="220" y2="72"/><line x1="232" y1="44" x2="232" y2="72"/>
    <line x1="244" y1="44" x2="244" y2="72"/><line x1="256" y1="44" x2="256" y2="72"/>
  </g>
  <text x="274" y="63" font-family="SFMono-Regular, Consolas, monospace" font-size="9" fill="#ad4b43">4e9/s</text>

  <!-- design B: nothing, then one resolve at login -->
  <rect x="18" y="86" width="248" height="28" rx="4" fill="#dfede5" stroke="#367f59" stroke-width="1.2"/>
  <line x1="258" y1="86" x2="258" y2="114" stroke="#367f59" stroke-width="3"/>
  <text x="274" y="105" font-family="SFMono-Regular, Consolas, monospace" font-size="9" fill="#367f59">1.4e5/s</text>

  <rect x="18" y="126" width="284" height="1" fill="#deded9"/>
  <text x="18" y="148" font-family="SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1" fill="#777772">NOTHING RUNS WHILE YOU'RE GONE</text>
</svg>
